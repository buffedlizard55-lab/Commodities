name: Forward desk cycle

# Scheduled paper-trading collector.  Every cycle reads ONLY public Kalshi endpoints (plus the
# NWS forecast for the weather personas), simulates taker fills against the fresh order book,
# settles positions from official results and commits the append-only ledger back to the repo.
# Nothing here can place a real order: no credentials exist and the client is read-only.
#
# Notes
#  * GitHub runs `schedule` triggers only on the default branch, five minutes is the shortest
#    interval it accepts, and delivery is best-effort under load (2026-09-22: only 13 of 118
#    expected 7/37 slots actually ran, which is why the desk now also takes */5 ticks).  Every run
#    records its own wall-clock time in data/season-<UTC year>/forward/cycles/*.jsonl, and
#    scripts/audit_season.py grades the delivered slots rather than assuming them.
#  * A */5 tick is deliberately cheap: it only looks at markets whose own close_time is inside
#    TICK_LIVE_WINDOW_SECONDS (3h), skips the archive/view rebuilds, and writes nothing at all
#    unless it actually filled or closed something - so quiet slots cost no data and no commits.
#    Ticks cover in-game play (live score, live book, momentum); the 7/37 cycles still do the
#    archiving, maker model, backtest, compaction and audit work.
#  * `workflow_dispatch` lets a maintainer run a cycle (or the universe discovery) on any branch.
#    A push to an arena branch whose commit message carries [desk:cycle] / [desk:universe] /
#    [desk:settlements] / [desk:both] runs that mode, which is how the settlement backfill is
#    exercised without dispatch rights.

on:
  push:
    branches: ["arena/**"]        # test hook: only runs when the commit message contains [desk]
  schedule:
    - cron: "*/5 * * * *"       # live tick: in-game markets only (see TICK_LIVE_WINDOW_SECONDS)
    - cron: "7,37 * * * *"      # full desk cycle, twice an hour
    - cron: "17 6 * * 1"        # weekly series-catalog refresh (Monday 06:17 UTC)
    - cron: "47 6 1 * *"        # monthly full settlement backfill (1st of month, 06:47 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle | universe | both | settlements"
        required: false
        default: "cycle"

permissions:
  contents: write
  actions: write      # lets the cycle re-deploy Pages (GITHUB_TOKEN pushes do not fire push-triggered workflows)

concurrency:
  group: forward-desk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desk:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[desk')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide what to run
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHEDULE="${{ github.event.schedule }}"
          # Recorded per cycle, so the ledger shows which trigger produced which rows (IRR-34).
          TRIGGER="${{ github.event_name }}"
          if [ -n "$SCHEDULE" ]; then TRIGGER="$TRIGGER:$SCHEDULE"; fi
          if [ -n "$MODE" ]; then TRIGGER="$TRIGGER:$MODE"; fi
          echo "DESK_TRIGGER=$TRIGGER" >> "$GITHUB_ENV"
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.event.head_commit.message }}" in
              *"[desk:universe]"*) MODE=universe ;;
              *"[desk:settlements]"*) MODE=settlements ;;
              *"[desk:both]"*) MODE=both ;;
              *) MODE=cycle ;;
            esac
          fi
          if [ -z "$MODE" ]; then
            # Matched by the crontab line's own prefix rather than the whole string, because the
            # expression's spacing is not something this workflow controls.
            case "$SCHEDULE" in
              "17 6 * * 1") MODE=universe ;;
              "47 6 1 * *") MODE=settlements ;;
              "*/5"*) MODE=tick ;;
              *) MODE=cycle ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE (trigger: $TRIGGER)"

      - name: Refresh series catalog (official GET /series by category)
        if: steps.mode.outputs.mode == 'universe' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/discover_universe.py

      # Full settlement backfill: re-read EVERY settled market in the ledger from
      # GET /markets/{ticker} (official) and compare result + settlement_ts with the ledger.
      # Runs monthly and on demand (workflow_dispatch mode=settlements).  Findings are committed
      # to forward/audit/settlement-backfill.json; the ledger is never adjusted here.  Non-zero
      # exit (a mismatch finding) must not abort the run, so it is surfaced but not fatal.
      - name: Full settlement backfill (official re-read of every settled market)
        if: steps.mode.outputs.mode == 'settlements' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/verify_settlements.py --live || echo "settlement backfill recorded finding(s) (see forward/audit/settlement-backfill.json)"

      - name: Run one desk cycle
        if: steps.mode.outputs.mode == 'cycle' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/forward_desk.py --live

      # Live tick: the cheapest real-time pass.  It narrows the universe to markets closing inside
      # the next three hours, skips the archive/view rebuilds, and persists nothing when it neither
      # filled nor closed a position.  Only the append-only ledger and the account state are written,
      # so the data cost of a 5-minute slot is proportional to what actually traded.
      - name: Run one live tick (in-game markets only)
        if: steps.mode.outputs.mode == 'tick'
        run: python3 scripts/forward_desk.py --live --tick

      # Measures this cycle's fills against the official trade tape (GET /markets/trades).
      # Never fatal: a missing tape window is recorded as its own status, not a failed build.
      - name: Compare fills with the official trade tape
        if: steps.mode.outputs.mode == 'cycle' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/execution_realism.py --live || echo "execution realism comparison incomplete"

      # SpreadSmith maker model: match every posted quote plan (intents status=quote_plan) against
      # the official trade tape after its post time.  MODELLED evidence about hypothetical resting
      # orders only (forward/execution/maker-model.json); never a ledger fill.  Never fatal.
      - name: Match maker quote plans against the official trade tape
        if: steps.mode.outputs.mode != 'tick'
        run: python3 scripts/maker_model.py --live || echo "maker model comparison incomplete"

      # Archive the full official candle history for the KXFED market (bounded chunks, one hash each).
      - name: Archive KXFED full candle history
        if: steps.mode.outputs.mode == 'cycle' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/archive_history.py --ticker KXFED-26SEP-T4.75 --period 1440 --live || echo "KXFED history archive incomplete"

      # Replay the committed candle archive bar by bar (verified tape only, official results only).
      - name: Rebuild the archive backtest
        if: steps.mode.outputs.mode != 'tick'
        run: python3 scripts/backtest_archive.py

      # Storage: verify existing compacted evidence still matches its recorded hash, then compact
      # evidence/quotes older than 3 days.  Append-only ledger files are never touched.
      - name: Check compacted storage (all seasons)
        if: steps.mode.outputs.mode != 'tick'
        run: python3 scripts/compact_storage.py --all-seasons --check

      - name: Compact old evidence and quote captures (all seasons)
        if: steps.mode.outputs.mode != 'tick'
        run: python3 scripts/compact_storage.py --all-seasons --days 3 --apply

      # Season health audit: cron-slot schedule gaps, ledger coverage, compaction state, signal
      # coverage, the tape summary, and (on cycle runs) a fresh re-read of settled markets from
      # GET /markets/{ticker}.  A mismatched settlement flips the report to FAIL and is then
      # caught by the verifier below, which fails the run - the issue stays in the repo log.
      - name: Season health audit
        if: steps.mode.outputs.mode != 'tick'
        run: python3 scripts/audit_season.py --live || echo "season audit recorded issues (see data/season-*/forward/audit/latest.json)"

      # The verifier always writes its findings into the season's audit directory (committed by the
      # step below), then the job is failed afterwards - so a runner-only failure is readable from
      # the repository itself, not just from a log.
      - name: Verify season memory (invariants + hashes)
        id: verify
        continue-on-error: true
        run: |
          SEASON=$(python3 -c "import json;print(json.load(open('data/seasons.json'))['activeSeason'])" 2>/dev/null || echo 2026)
          mkdir -p "data/season-$SEASON/forward/audit"
          python3 scripts/verify_data.py --report "data/season-$SEASON/forward/audit/verify-latest.json"

      - name: Offline tests
        if: steps.mode.outputs.mode != 'tick'
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Commit and push the ledger
        id: publish
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "forward-desk[bot]"
          git config user.email "forward-desk[bot]@users.noreply.github.com"
          mkdir -p data/universe
          # season-agnostic: a rolled-over season (data/season-<next year>) commits like any other.
          # Adapter caches are gitignored, so only verified artifacts are ever added.
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          SEASON=$(python3 -c "import json;print(json.load(open('data/seasons.json'))['activeSeason'])" 2>/dev/null || echo "2026")
          CYCLE=$(python3 -c "import json,sys;print((json.load(open('data/season-'+sys.argv[1]+'/forward/state.json')).get('lastCycle') or {}).get('cycle','universe'))" "$SEASON" 2>/dev/null || echo "universe")
          git commit -m "desk: ${{ steps.mode.outputs.mode }} ${CYCLE}" -m "Automated forward-desk cycle (official Kalshi public API + NWS/ESPN/openFDA signals). See data/season-${SEASON}/forward/."
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push failed (attempt $attempt); rebasing"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          exit 1

      # Fails the job after the ledger (and the failure report) are committed.
      - name: Surface verification failures
        if: steps.verify.outcome == 'failure'
        run: |
          echo "verify_data.py reported failures; the report is committed at"
          echo "data/season-*/forward/audit/verify-latest.json"
          exit 1

      - name: Re-deploy GitHub Pages with the new ledger (default branch only)
        if: steps.publish.outputs.pushed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}" || echo "pages dispatch skipped"
