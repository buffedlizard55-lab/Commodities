name: Forward desk cycle

# Scheduled paper-trading collector.  Every cycle reads ONLY public Kalshi endpoints (plus the
# NWS forecast for the weather personas), simulates taker fills against the fresh order book,
# settles positions from official results and commits the append-only ledger back to the repo.
# Nothing here can place a real order: no credentials exist and the client is read-only.
#
# Notes
#  * GitHub runs `schedule` triggers only on the default branch and may delay them under load;
#    every cycle records its own wall-clock time in data/season-2026/forward/cycles/*.jsonl.
#  * `workflow_dispatch` lets a maintainer run a cycle (or the universe discovery) on any branch.

on:
  schedule:
    - cron: "7,37 * * * *"      # desk cycle, twice an hour
    - cron: "17 6 * * 1"        # weekly series-catalog refresh (Monday 06:17 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle | universe | both"
        required: false
        default: "cycle"

permissions:
  contents: write

concurrency:
  group: forward-desk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide what to run
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "17 6 * * 1" ]; then MODE=universe; else MODE=cycle; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Refresh series catalog (official GET /series by category)
        if: steps.mode.outputs.mode == 'universe' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/discover_universe.py

      - name: Run one desk cycle
        if: steps.mode.outputs.mode == 'cycle' || steps.mode.outputs.mode == 'both'
        run: python3 scripts/forward_desk.py --live

      - name: Verify season memory (invariants + hashes)
        run: python3 scripts/verify_data.py

      - name: Offline tests
        run: python3 -m unittest tests.test_forward_desk

      - name: Commit and push the ledger
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "forward-desk[bot]"
          git config user.email "forward-desk[bot]@users.noreply.github.com"
          mkdir -p data/universe
          git add -A data/season-2026 data/universe
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          CYCLE=$(python3 -c "import json;print((json.load(open('data/season-2026/forward/state.json')).get('lastCycle') or {}).get('cycle','universe'))" 2>/dev/null || echo "universe")
          git commit -m "desk: ${{ steps.mode.outputs.mode }} ${CYCLE}" -m "Automated forward-desk cycle (official Kalshi public API + NWS). See data/season-2026/forward/."
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            echo "push failed (attempt $attempt); rebasing"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          exit 1
